# mypy config for supermicro-ipmi-cert. Read by super-linter
# (PYTHON_MYPY_CONFIG_FILE defaults to this path).
[mypy]
# Deliberately lenient: this is a ported single-file tool that doesn't opt
# into static typing, and super-linter's container doesn't install
# requirements.txt so third-party imports (requests, OpenSSL) are
# unresolvable here anyway. Real import checks happen in pytest CI.
ignore_missing_imports = True
